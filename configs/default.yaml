profile: local

paths:
  data_dir: "${env:ARTRAG_DATA_DIR,./data}"
  results_dir: ./results

data:
  cma_type: Painting
  min_description_chars: 50
  image_max_side: 512
  image_quality: 90
  image_workers: 8
  image_timeout_s: 30
  image_max_retries: 3
  image_backoff_s: 2.0
  image_user_agent: "artrag/0.1 (educational RAG project; contact: local)"
  cma_api_base: "https://openaccess-api.clevelandart.org/api/artworks/"
  cma_page_size: 1000
  cma_timeout_s: 60
  cma_max_retries: 3
  cma_backoff_s: 2.0
  cma_user_agent: "artrag/0.1 (educational RAG project; contact: local)"
  chunking:
    sentence_max_words: 180
    field_max_words: 250
    overlap_sentences: 1
    max_words_per_chunk: 250
    max_exhibitions: 10
    # --- Chiến lược chunking (T1.5, ablation T1b) ---
    # `sentence` = C1 (baseline, mặc định cho mọi field)
    # `item`     = C2 (tách theo mục tự nhiên, dùng cho field danh sách)
    # `semantic` = C3 (tách theo đoạn văn, dùng cho field văn xuôi dài)
    strategy_description: sentence
    strategy_did_you_know: sentence
    strategy_overview: sentence
    strategy_provenance: sentence
    strategy_exhibitions: sentence
    strategy_artist_bio: sentence
    semantic_target_words: 120
    semantic_max_words: 250
    semantic_min_words: 40
    item_separator: "; "
    # Sinh bảng biến thể đầy đủ (C1 + C2 + C3) để so sánh trong báo cáo.
    write_variants: false
  wiki_search_limit: 10
  wiki_label_threshold: 88
  wiki_birth_tolerance: 3
  wiki_min_interval_s: 0.35
  wiki_timeout_s: 30
  wiki_max_retries: 4
  wiki_backoff_s: 3.0
  wiki_user_agent: "artrag/0.1 (educational RAG project; contact: local)"
  wiki_progress_every: 25
  wiki_mode: batch
  wiki_batch_size: 25
  wiki_extract_batch_size: 20
  bio_prefer_cma: true
  bio_min_chars: 40

index:
  clip_model: clip
  text_model: text_embed
  batch_size: 64
  caption_model: blip_cap
  caption_max_new_tokens: 30
  caption_num_beams: 3

# Cấu hình registry (SYSTEM_DESIGN 6.2). Danh mục model nằm ở configs/models.yaml;
# khối `models:` dưới đây chỉ chứa ghi đè theo profile/experiment/--set.
models:
  # evict_to: "cpu" -> khi bị giải phóng LRU vì hết VRAM thì model được nạp lại
  # trên CPU (vẫn dùng được, chậm hơn). "free" -> xoá hẳn khỏi registry.
  evict_to: cpu

query:
  translator: vinai
  clip_template: T1
  title_boost: 0.15

retrieval:
  n_clip: 50
  n_text: 100
  top_n: 20
  fuse: minmax
  bio_propagation: 0.8
  branch_weights:
    VISUAL: [0.6, 0.4]
    CONTENT: [0.6, 0.4]
    IDENTIFY: [0.8, 0.2]
    GENERAL: [0.5, 0.5]
    default_meta: [0.2, 0.8]

rerank:
  mode: visual_only
  w_clip: 0.5
  w_blip: 0.5
  batch_size: 8

evidence:
  top_k: 3
  max_snippets: 2
  vqa: true
  vqa_low_conf: 0.3

abstain:
  enabled: true
  tau_text: 0.45
  tau_clip: 0.24
  tau_img: 0.85
  delta: 0.05
  force_on_no_citation: true

context:
  max_tokens: 1500
  max_snippet_words: 120

llm:
  backend: hf_local
  model: qwen3b
  prompt: grounded_vi_v1
  gen:
    max_new_tokens: 256
    temperature: 0.0
  fallback: null
  # --- Tham số hạ tầng gọi API (T2.3) ---
  timeout_s: 60
  max_retries: 5
  backoff_s: 1.0
  # Tên thư mục cache (đặt dưới `paths.data_dir/cache/`)
  cache_dir: llm

backends:
  # Backend chạy local trên máy: model causal LM lấy từ ModelRegistry
  # (configs/models.yaml). Nạp lazy -> dựng backend không tốn VRAM.
  hf_local:
    type: hf_local
    model: qwen3b
  # Backend FLAN-T5: sinh câu trả lời bằng FLAN-T5 (EN) rồi dịch EN->VI.
  # Model lấy từ registry (task `seq2seq`); nạp lazy -> không tốn VRAM nếu không hỏi.
  flan_t5:
    type: flan_t5
    model: flan_t5
    en2vi_model: en2vi
    vi2en_model: vi2en
    # Chỉ dẫn lượt 1 (sinh câu trả lời) và lượt 2 (chọn nhãn bằng chứng).
    # Lượt 1 KHÔNG được nhắc trích nhãn: FLAN-T5-base sẽ chỉ phát nhãn
    # (`[IMG-01]. [IMG-01]`) thay vì trả lời (đo thực tế 8/15 mẫu rỗng).
    # Lượt 2 là cần thiết vì model không tự phát lại nhãn `[IMG-xx]`.
    instruction: >-
      Answer the question in a short sentence, using only the evidence.
    label_instruction: >-
      Which evidence label does this answer come from?
      Answer with the label only, for example [IMG-01].
  groq:
    type: openai_compat
    base_url: https://api.groq.com/openai/v1
    # Danh sách model hiện hành của Groq (đọc 2026-11-27):
    # openai/gpt-oss-120b · openai/gpt-oss-20b · qwen/qwen3.8-27b · allam-2-7b ...
    model: qwen/qwen3.8-27b
    # Nhiều key cho cùng provider: xoay vòng khi provider trả 429/401.
    api_key_envs: [GROQ_API_KEY, SECOND_GROQ_API_KEY]
    rpm_limit: 30
  nim:
    type: openai_compat
    base_url: https://integrate.api.nvidia.com/v1
    # Danh sách model hiện hành của NVIDIA NIM (đọc 2026-11-27):
    # nvidia/nemotron-3.5-bolt-e4b · mistralai/mistral-large-4-1t-a52b
    # · google/gemma-3-12b-it · z-ai/glm-5.3-flash · nvidia/nemotron-3-ultra-550b-a55b
    # Lưu ý: model mistral-large trả `content=null` khi hết `max_tokens` vì còn
    # phần `reasoning_content` -> nên dùng nemotron cho backend dự phòng.
    model: nvidia/nemotron-3.5-bolt-e4b
    api_key_envs: [NVIDIA_API_KEY, SECOND_NVIDIA_API_KEY]
    rpm_limit: 40
