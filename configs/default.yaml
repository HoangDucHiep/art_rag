profile: local

paths:
  data_dir: "${env:ARTRAG_DATA_DIR,./data}"
  results_dir: ./results

data:
  cma_type: Painting
  min_description_chars: 50
  image_max_side: 512
  cma_api_base: "https://openaccess-api.clevelandart.org/api/artworks/"
  cma_page_size: 1000
  cma_timeout_s: 60
  cma_max_retries: 3
  cma_backoff_s: 2.0
  cma_user_agent: "artrag/0.1 (educational RAG project; contact: local)"
  chunking:
    sentence_max_words: 180
    field_max_words: 250
    overlap_sentences: 1
    max_words_per_chunk: 250
    max_exhibitions: 10
  wiki_search_limit: 10
  wiki_label_threshold: 88
  wiki_birth_tolerance: 3
  wiki_min_interval_s: 0.35
  wiki_timeout_s: 30
  wiki_max_retries: 4
  wiki_backoff_s: 3.0
  wiki_user_agent: "artrag/0.1 (educational RAG project; contact: local)"
  wiki_progress_every: 25
  wiki_mode: batch
  wiki_batch_size: 25
  wiki_extract_batch_size: 20
  bio_prefer_cma: true
  bio_min_chars: 40

index:
  clip_model: clip
  text_model: text_embed
  batch_size: 64

query:
  translator: vinai
  clip_template: T1
  title_boost: 0.15

retrieval:
  n_clip: 50
  n_text: 100
  top_n: 20
  fuse: minmax
  bio_propagation: 0.8
  branch_weights:
    VISUAL: [0.6, 0.4]
    CONTENT: [0.6, 0.4]
    IDENTIFY: [0.8, 0.2]
    GENERAL: [0.5, 0.5]
    default_meta: [0.2, 0.8]

rerank:
  mode: visual_only
  w_clip: 0.5
  w_blip: 0.5
  batch_size: 8

evidence:
  top_k: 3
  max_snippets: 2
  vqa: true
  vqa_low_conf: 0.3

abstain:
  enabled: true
  tau_text: 0.45
  tau_clip: 0.24
  tau_img: 0.85
  delta: 0.05
  force_on_no_citation: true

context:
  max_tokens: 1500
  max_snippet_words: 120

llm:
  backend: hf_local
  model: qwen3b
  prompt: grounded_vi_v1
  gen:
    max_new_tokens: 256
    temperature: 0.0
  fallback: null

backends:
  groq:
    type: openai_compat
    base_url: https://api.groq.com/openai/v1
    model: llama-3.3-70b-versatile
    api_key_env: GROQ_API_KEY
    rpm_limit: 30
  nim:
    type: openai_compat
    base_url: https://integrate.api.nvidia.com/v1
    model: meta/llama-3.3-70b-instruct
    api_key_env: NVIDIA_API_KEY
    rpm_limit: 40
