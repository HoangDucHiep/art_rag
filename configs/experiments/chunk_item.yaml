# C2 `item` - tách theo MỤC TỰ NHIÊN, không cắt giữa một mục.
#
# Áp dụng cho hai field có cấu trúc danh sách nối bằng "; ":
#   - `provenance`  (mỗi entry là "date: description")
#   - `exhibitions` (mỗi mục là "title (description)")
#
# Vấn đề baseline C1: `exhibitions` có 84/1697 tác phẩm bị cắt thành nhiều
# chunk (166 chunk kết thúc giữa một mục), `provenance` có 2 chunk kết thúc
# giữa một mục. C2 sửa đúng lỗi đó (chỉ cắt cứng khi một mục đơn lẻ dài
# quá 250 từ).
#
#   uv run python -m artrag.eval.chunk_eval --variant item
#   uv run python -m artrag.data.build_kb --with-bio

data:
  chunking:
    strategy_description: sentence
    strategy_did_you_know: sentence
    strategy_overview: sentence
    strategy_provenance: item
    strategy_exhibitions: item
    strategy_artist_bio: sentence
    item_separator: "; "
