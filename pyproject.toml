[project]
name = "artrag"
version = "0.1.0"
description = "Trợ lý Bảo tàng Thông minh: Multimodal RAG có dẫn chứng trên bộ sưu tập Cleveland Museum of Art"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "requests>=2.32",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
    "diskcache>=5.6",
    "pillow>=10.0",
    # --- Học máy (T2.2) ---
    # torch phải lấy từ index cu121 (xem [tool.uv.sources] + [[tool.uv.index]]).
    #
    # Vì sao ghim transformers < 4.47:
    #   transformers từ 4.47 trở đi chặn `torch.load` (checkpoint .bin) nếu torch < 2.6
    #   (CVE-2025-32434). Nhưng bản cp311 của index cu121 chỉ có tới torch 2.5.1,
    #   nên các checkpoint chỉ có .bin (CLIP, BGE-M3, BLIP-ITM/CAP, vinai) sẽ không
    #   nạp được. transformers 4.46.3 chưa có bộ chặn này; các model có
    #   safetensors (BLIP-VQA, flan-t5, NLI) vẫn được nạp qua đường an toàn.
    #   Ghi chú bảo mật: chỉ nạp checkpoint public đã biết, với weights_only=True.
    "torch==2.5.1",
    "transformers>=4.46,<4.47",
    "sentence-transformers>=4.1,<5",
    "faiss-cpu>=1.7",
    # accelerate: bắt buộc khi from_pretrained(low_cpu_mem_usage=True).
    # Ghim <1.6 vì bản 1.16 yêu cầu torch>=2.6.
    "accelerate>=1.1,<1.6",
    # protobuf: tokenizer sentencepiece của model vinai cần thư viện này.
    "protobuf>=4.25",
    # sentencepiece: tokenizer MBart của model vinai (vi2en/en2vi) cần thư viện này.
    "sentencepiece>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artrag"]

# torch cho Windows: bản cp311 cu121 (2.1.0–2.5.1). Driver máy local là CUDA 13.3
# nên vẫn chạy được (cu121 tương thích ngược).
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
