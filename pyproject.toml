[project]
name = "artrag"
version = "0.1.0"
description = "Trợ lý Bảo tàng Thông minh: Multimodal RAG có dẫn chứng trên bộ sưu tập Cleveland Museum of Art"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "requests>=2.32",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
    "diskcache>=5.6",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
